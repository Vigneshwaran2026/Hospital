/* REMOVE SCROLL */
html, body {
  height: 100%;
  overflow-x: hidden !important;
}

/* BACK BUTTON STYLE */
.login-back-home {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 999;
}

.login-page .container {
  height: 100%;
  display: flex;
  align-items: center; /* center properly */
  padding-top: 0; /* remove extra space */
}
/* CENTER CONTENT */
.login-page .row {
  width: 100%;
  align-items: center;
}

.login-page__image,
.login-page__form {
  width: 100%;
}

/* MOBILE CENTER */
@media (max-width: 768px) {
  .login-page {
    height: auto;
    padding: 40px 0;
  }

  html, body {
    overflow: auto;
  }
}



/* LIMIT FORM HEIGHT */
.login-page__form__inner {
  max-width: 420px;
  margin: auto;
}

.login-page {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.login-page .row {
  max-width: 1000px;
  margin: auto;
}

.row.gutter-y-60 {
  --bs-gutter-y: 20px; /* reduce spacing */
}

/* MOVE RIGHT FORM UP */
.login-page__form {
  margin-top: -20px; /* adjust (-10px to -40px as needed) */
}


.login-page .row {
  align-items: flex-start; /* instead of center */
  padding-top: 20px;
}

/* STYLE ROLE DROPDOWN SAME AS INPUT */
.login-page__form__input-box select {
  width: 100%;
  height: 55px;
  border-radius: 10px;
  border: 1px solid #e3e3e3;
  padding: 0 15px;
  font-size: 14px;
  color: #333;
  background: #fff;
  outline: none;
}

/* COMMON INPUT STYLE */
.login-page__form__input-box input,
.login-page__form__input-box select {
  width: 100%;
  height: 55px;
  border-radius: 10px;
  border: 1px solid #e3e3e3;
  padding: 0 15px;
  font-size: 14px;
  color: #333;
  background: #fff;
  outline: none;
}

.login-page__form__checked-box {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap; /* prevents line break */
  font-size: 14px;
}

/* PERFECT ALIGNMENT */
.login-page__form__checked-box {
  display: flex;
  align-items: center; /* vertical center */
  gap: 10px;
  white-space: nowrap;
  line-height: 1; /* remove extra space */
}

/* FIX CHECKBOX ICON POSITION */
.login-page__form__checked-box span {
  position: relative;
}

.login-page__form__checked-box span {
  display: inline-block;
  vertical-align: middle;
}


.login-page .row {
  max-width: 1100px; /* increase overall width */
}

.login-page__image {
  display: flex;
  justify-content: center;
}

/* BIGGER IMAGE */
.login-page__image {
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-page__image__inner {
  width: 100%;
  max-width: 550px; /* increase */
}


/* RESET OLD STYLES */
.login-page__form__checked-box span {
  all: unset;
}

/* FLEX ALIGN */
.login-page__form__checked-box {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
}

/* HIDE DEFAULT */
.login-page__form__checked-box input {
  display: none;
}

/* CUSTOM BOX */
.login-page__form__checked-box .checkmark {
  width: 18px;
  height: 18px;
  border: 2px solid #00b4d8;
  border-radius: 4px;
  display: inline-block;
  position: relative;
}

/* CHECKED STATE */
.login-page__form__checked-box input:checked + .checkmark {
  background: #00b4d8;
}

/* TICK ICON */
.login-page__form__checked-box input:checked + .checkmark::after {
  content: "✓";
  position: absolute;
  color: #fff;
  font-size: 12px;
  left: 3px;
  top: -1px;
}

.error-msg {
  color: red;
  font-size: 12px;
  margin-top: 5px;
  display: block;

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();
    let terms = document.getElementById("terms").checked;

    let emailError = document.getElementById("emailError");
    let passwordError = document.getElementById("passwordError");
    let confirmError = document.getElementById("confirmError");
    let termsError = document.getElementById("termsError");

    let isValid = true;

    // RESET
    emailError.textContent = "";
    passwordError.textContent = "";
    confirmError.textContent = "";
    termsError.textContent = "";

    // EMAIL
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        emailError.textContent = "Enter valid email";
        isValid = false;
    }

    // PASSWORD
    let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
    if (!password.match(passwordPattern)) {
        passwordError.textContent = "Strong password required";
        isValid = false;
    }

    // CONFIRM PASSWORD
    if (password !== confirmPassword) {
        confirmError.textContent = "Passwords do not match";
        isValid = false;
    }

    // CHECKBOX VALIDATION
    if (!terms) {
        termsError.textContent = "You must accept terms";
        isValid = false;
    }

    // SUCCESS → DIRECT REDIRECT (NO POPUP)
    if (isValid) {
        window.location.href = "login.html";
    }

});
</script>
