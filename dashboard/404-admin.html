
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow-x: hidden;
}

/* ================= VARIABLES ================= */
:root {
  --stackly-text-rgb: 112, 120, 130;
  --stackly-text-dark: #456EA1;
  --stackly-base: #33C1ED;
  --stackly-base-rgb: 51, 193, 237;
  --stackly-primary: #2C51A3;
}

/* ================= BODY FIX ================= */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, var(--stackly-primary), var(--stackly-text-dark));

  height: 100dvh;          /* ✅ fixed height */
  overflow: hidden;        /* ✅ remove vertical scroll */

  display: flex;
  justify-content: center;
  align-items: center;

  position: relative;
}
/* ================= PARTICLES ================= */
.particles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: rgba(var(--stackly-base-rgb), 0.3);
  border-radius: 50%;
  animation: float 15s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100%) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100%) rotate(720deg); opacity: 0; }
}

/* ================= CONTAINER ================= */
.container {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 20px;
  max-width: 600px;
  width: 90%;
  margin: auto;
}

/* ================= 404 TEXT ================= */
.error-code {
  font-size: clamp(100px, 18vw, 180px);
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 3px var(--stackly-base);
  text-shadow: 0 0 20px rgba(var(--stackly-base-rgb), 0.5);
  animation: pulse 2s ease-in-out infinite;
  line-height: 1;
  margin-bottom: 1rem;
  position: relative;
}

.error-code::before {
  content: '404';
  position: absolute;
  inset: 0;
  color: var(--stackly-base);
  opacity: 0.1;
  transform: translate(6px, 6px);
  z-index: -1;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ================= TEXT ================= */
.error-title {
  font-size: clamp(22px, 5vw, 32px);
  color: #fff;
  font-weight: 700;
  margin-bottom: 1rem;
}

.error-description {
  font-size: 15px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 2rem;
  line-height: 1.6;
}

/* ================= BUTTON ================= */
.home-btn {
  display: block;
  width: 100%;
  max-width: 280px;
  margin: auto;
  padding: 14px;
  background: var(--stackly-base);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  border-radius: 50px;
  transition: 0.3s;
}

.home-btn:hover {
  background: #fff;
  color: var(--stackly-primary);
}

/* ================= SHAPES ================= */
.circle {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(var(--stackly-base-rgb), 0.2);
  animation: rotate 20s linear infinite;
  pointer-events: none;
}

/* 🔥 REDUCED SIZE (FIX OVERFLOW) */
.circle-1 {
  width: 180px;
  height: 180px;
  top: -60px;
  right: -40px;
}

.circle-2 {
  width: 140px;
  height: 140px;
  bottom: -60px;
  left: -40px;
}

.circle-3 {
  display: none; /* REMOVE OVERFLOW */
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ================= SHAPE ================= */
.geometric-shape {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 3px solid var(--stackly-base);
  top: 10%;
  right: 10%;
  animation: floatShape 6s ease-in-out infinite;
  opacity: 0.5;
}

@keyframes floatShape {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.container {
  max-height: 100%;
  overflow: hidden;
}

/* ================= MOBILE ================= */
@media (max-width: 576px) {

  body {
    padding: 0;
  }

  .container {
    width: 100%;
    padding: 10px;
  }

  .error-code {
    font-size: 70px;
    -webkit-text-stroke: 2px var(--stackly-base);
  }

  .error-title {
    font-size: 20px;
  }

  .error-description {
    font-size: 14px;
  }

  .home-btn {
    width: 100%;
  }
}
    </style>
</head>
<body>
    <!-- Animated particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Decorative circles -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <!-- Floating geometric shape -->
    <div class="geometric-shape"></div>

    <!-- Main content -->
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
            Oops! The page you're looking for seems to have vanished into the digital void. 
            Let's get you back on track.
        </p>
        <a href="admin-dashboard.html" class="home-btn">Back to Dashboard</a>
    </div>
</body>
</html>
