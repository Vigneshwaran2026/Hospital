html, body {
  height: 100%;
  overflow-x: hidden !important;
}
/* BACK BUTTON STYLE */
.login-back-home {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 999;
}

.login-page .container {
  height: 100%;
  display: flex;
  align-items: center; /* center properly */
  padding-top: 0; /* remove extra space */
}
/* CENTER CONTENT */
.login-page .row {
  width: 100%;
  align-items: center;
}

.login-page__image,
.login-page__form {
  width: 100%;
}

/* MOBILE CENTER */
@media (max-width: 768px) {
  .login-page {
    height: auto;
    padding: 40px 0;
  }

  html, body {
    overflow: auto;
  }
}

/* LIMIT IMAGE HEIGHT */
.login-page__image__inner img {
  max-height: 500px; /* adjust */
  object-fit: cover;
  width: 100%;
}

/* LIMIT FORM HEIGHT */
.login-page__form__inner {
  max-width: 420px;
  margin: auto;
}

.login-page {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.login-page__image__inner img {
  max-height: 500px;
  object-fit: cover;
}

.login-page .row {
  max-width: 1000px;
  margin: auto;
}

.row.gutter-y-60 {
  --bs-gutter-y: 20px; /* reduce spacing */
}

/* MOVE RIGHT FORM UP */
.login-page__form {
  margin-top: -20px; /* adjust (-10px to -40px as needed) */
}


.login-page .row {
  align-items: flex-start; /* instead of center */
  padding-top: 20px;
}

/* STYLE ROLE DROPDOWN SAME AS INPUT */
.login-page__form__input-box select {
  width: 100%;
  height: 55px;
  border-radius: 10px;
  border: 1px solid #e3e3e3;
  padding: 0 15px;
  font-size: 14px;
  color: #333;
  background: #fff;
  outline: none;
}

/* BACKDROP */
.modern-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* POPUP BOX */
.modern-popup__content {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: popupFade 0.3s ease;
}

/* TITLE */
.modern-popup__title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 10px;
}

/* SUBTITLE */
.modern-popup__subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
}

/* INPUT */
.modern-popup__content input {
  width: 100%;
  height: 50px;
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 0 15px;
  font-size: 14px;
  margin-bottom: 10px;
}

/* BUTTONS */
.modern-popup__actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

/* PRIMARY BUTTON */
.btn-primary {
  flex: 1;
  height: 45px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #33C1ED, #00AEEF);
  color: #fff;
  font-weight: 500;
  cursor: pointer;
}

/* OUTLINE BUTTON */
.btn-outline {
  flex: 1;
  height: 45px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: transparent;
  cursor: pointer;
}

/* HOVER EFFECT */
.btn-primary:hover {
  opacity: 0.9;
}

.btn-outline:hover {
  background: #f5f5f5;
}

/* ANIMATION */
@keyframes popupFade {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.error-msg {
  color: red;
  font-size: 12px;
  display: block;
  margin-top: 5px;
}

<script>
// LOGIN VALIDATION
document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value.trim();
    let role = document.getElementById("loginRole").value;
   
    let emailError = document.getElementById("loginEmailError");
    let passError = document.getElementById("loginPasswordError");
    let roleError = document.getElementById("roleError");

    let isValid = true;

    emailError.textContent = "";
    passError.textContent = "";
    roleError.textContent = "";

    // EMAIL VALIDATION
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        emailError.textContent = "Enter valid email";
        isValid = false;
    }

       let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
    if (!password.match(passwordPattern)) {
        passError.textContent = "Strong password required";
        isValid = false;
    }


    // ROLE VALIDATION
    if (role === "") {
        roleError.textContent = "Select role";
        isValid = false;
    }

    // SUCCESS → ROLE BASED REDIRECT
    if (isValid) {
         localStorage.setItem("userEmail", email);
        if (role === "admin") {
            window.location.href = "dashboard/admin-dashboard.html";
        } else if (role === "doctor") {
            window.location.href = "dashboard/doctor-dashboard.html";
        } else {
            window.location.href = "dashboard/patient-dashboard.html";
        }
    }

});


// POPUP FUNCTIONS
function openPopup() {
    document.getElementById("forgotPopup").style.display = "flex";
}

function closePopup() {
    document.getElementById("forgotPopup").style.display = "none";
}

// FORGOT PASSWORD VALIDATION
function sendResetLink() {
    let email = document.getElementById("forgotEmail").value.trim();
    let error = document.getElementById("forgotError");

    error.textContent = "";

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (!email.match(emailPattern)) {
        error.textContent = "Enter valid email";
        return;
    }

    // SUCCESS → REDIRECT
    window.location.href = "404.html";
}
</script>

<script>
document.getElementById("forgotPopup").addEventListener("click", function(e) {
    if (e.target === this) {
        this.style.display = "none";
    }
});
</script>
